openapi: 3.0.3
info:
  title: Dog Listings API
  description: |
    RESTful backend API for managing dog listings.

    **Authentication:** register (`POST /api/users`) or log in (`POST /api/auth/login`)
    to get a token, then click **Authorize** and paste it. Protected routes expect
    the header `Authorization: Bearer <token>`. Users can only read and change their
    own account and dog listings.
  version: 2.0.0
  contact:
    name: John Aedo
servers:
  - url: http://localhost:5000
    description: Local Development Server
  - url: http://mern.johnaedo.com:5000
    description: Production Server

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Dogs

paths:
  /api/ping:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: The server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello World

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Checks a login and password and returns a token for the protected routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong login or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    post:
      tags: [Users]
      summary: Register a new user
      description: Creates an account and logs the new user in. `role` may be `user` (default) or `shelter`; only shelter accounts can add dogs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          headers:
            Location:
              description: URL of the new user
              schema:
                type: string
                example: /api/users/6accf6233d21392120c442db
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get your own account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{userId}/cards:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Dogs]
      summary: List your dogs
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive match on name, breed, gender, size, location, or description, or an exact age or price
          schema:
            type: string
            example: speedy
      responses:
        '200':
          description: The user's dogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Dogs]
      summary: Add a dog
      description: Dog names must be unique per user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DogInput'
      responses:
        '201':
          description: Dog created
          headers:
            Location:
              description: URL of the new dog
              schema:
                type: string
                example: /api/cards/6accf63063fba309139648cb
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/cards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The dog's id
        schema:
          type: string
          example: 6accf63063fba309139648cb
    get:
      tags: [Dogs]
      summary: Get one of your dogs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The dog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Dogs]
      summary: Update one of your dogs
      description: Changes only the fields sent. A dog's owner can't be changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DogInput'
      responses:
        '200':
          description: The updated dog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Dogs]
      summary: Delete one of your dogs
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: The user's id. Must be the logged-in user.
      schema:
        type: string
        example: 6accf6233d21392120c442db

  schemas:
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: johnaedo
        password:
          type: string
          format: password
          example: ucf123!

    RegisterRequest:
      type: object
      required: [login, password]
      properties:
        firstName:
          type: string
          example: Moxie
        lastName:
          type: string
          example: Aedo
        login:
          type: string
          example: moxie
        password:
          type: string
          format: password
          example: foobar123!
        email:
          type: string
          example: moxie@example.com
        role:
          type: string
          enum: [user, shelter]
          default: user
          description: Select shelter to register a shelter account; only shelters can add dogs.

    User:
      type: object
      properties:
        _id:
          type: string
          example: 6accf6233d21392120c442db
        firstName:
          type: string
        lastName:
          type: string
        login:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, shelter]
          example: user

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: 'Send as "Authorization: Bearer <token>" on protected routes'
        user:
          $ref: '#/components/schemas/User'

    DogInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Bella
        breed:
          type: string
          example: Labrador Retriever
        age:
          type: number
          minimum: 0
          example: 3
        gender:
          type: string
          enum: [male, female, unknown]
        size:
          type: string
          enum: [small, medium, large, extra-large, unknown]
        location:
          type: string
          example: Orlando, FL
        intakeDate:
          type: string
          format: date-time
        price:
          type: number
          minimum: 0
          example: 250
        description:
          type: string
          example: Friendly and energetic.
        status:
          type: string
          enum: [available, pending, adopted]

    Dog:
      allOf:
        - $ref: '#/components/schemas/DogInput'
        - type: object
          properties:
            _id:
              type: string
              example: 6accf63063fba309139648cb
            userId:
              type: string
              description: Id of the user who owns the dog
              example: 6accf6233d21392120c442db

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Missing or invalid input, or a malformed id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No token, or the token is invalid or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The resource belongs to another user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No resource with that id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A resource with that name already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
