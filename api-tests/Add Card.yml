info:
  name: Add Card
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseURL}}/api/users/{{userId}}/cards"
  body:
    type: json
    data: |-
      {
        "name": "{{dogName}}",
        "breed": "Beagle",
        "age": 2,
        "gender": "male",
        "size": "medium",
        "location": "Orlando, FL",
        "intakeDate": "2025-01-15",
        "price": 123,
        "description": "Friendly and playful."
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // A user can't own two dogs with the same name, so make each run unique
        bru.setVar("dogName", `Test Dog ${Date.now()}`);
    - type: after-response
      code: |-
        // Save the new dog's id for the get, update, and delete requests
        if (res.getStatus() === 201) {
          bru.setVar("cardId", res.getBody()._id);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 201 Created", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("sets a Location header pointing at the new card", function () {
          expect(res.getHeader("location")).to.equal(`/api/cards/${body._id}`);
        });

        test("returns the card with the fields that were sent", function () {
          expect(body.name).to.equal(bru.getVar("dogName"));
          expect(body.breed).to.equal("Beagle");
          expect(body.age).to.equal(2);
          expect(body.price).to.equal(123);
        });

        test("the card belongs to the logged-in user", function () {
          expect(body.userId).to.equal(bru.getVar("userId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
