info:
  name: Update Card
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseURL}}/api/cards/{{cardId}}"
  body:
    type: json
    data: |-
      {
        "price": 432
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("changes only the fields sent", function () {
          expect(body.price).to.equal(432);
          expect(body.name).to.equal(bru.getVar("dogName"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
